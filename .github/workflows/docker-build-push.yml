name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # APP_ID identifies the GitHub App; APP_PRIVATE_KEY authenticates it to
      # obtain a short-lived token scoped to the automation-iac repository.
      - name: Create automation-iac GitHub App token
        id: automation_iac_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID || vars.APP_CODE }}
          private-key: ${{ secrets.APP_PRIVATE_KEY || secrets.APP_SECRET }}
          owner: ${{ github.repository_owner }}
          repositories: automation-iac

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=dev-1.0.0-{{sha}}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          build-args: |
            KB_BASE_PATH=${{ vars.KB_BASE_PATH || '/kb-studio' }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Checkout automation-iac
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/automation-iac
          token: ${{ steps.automation_iac_token.outputs.token }}
          path: automation-iac

      - name: Update kb-studio image tag in automation-iac (Dev)
        run: |
          cd automation-iac
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          NEW_TAG="dev-1.0.0-${SHORT_SHA}"
          python3 -c "
          import re
          path = 'k8/aws/helm/service-layer/values.yaml'
          with open(path, 'r') as f:
              content = f.read()
          new_content = re.sub(
              r'(kbStudio:\s*\n\s*enabled:[^\n]*\n\s*image:\s*\n\s*repository:[^\n]*\n\s*tag:\s*)dev-1\.0\.0-[a-f0-9]+',
              r'\g<1>dev-1.0.0-${SHORT_SHA}',
              content,
          )
          with open(path, 'w') as f:
              f.write(new_content)
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8/aws/helm/service-layer/values.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit (tag already up to date)."
          else
            git commit -m "ci(kb-studio): update image tag to ${NEW_TAG} (dev)"
            git push origin main
          fi
